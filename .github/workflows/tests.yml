name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Install locked development dependencies
        run: uv sync --extra dev --locked
      - name: Check Ruff lint
        run: uv run --locked --extra dev ruff check chess tests notebooks
      - name: Check Ruff formatting
        run: uv run --locked --extra dev ruff format --check chess tests
      - name: Check types
        run: uv run --locked --extra dev mypy chess
      - name: Test chess contracts and coverage
        run: uv run --locked --extra dev pytest --cov=chess --cov-fail-under=80 -q
      - name: Build and smoke test an isolated wheel
        run: |
          uv build --out-dir "$RUNNER_TEMP/dist"
          uv venv --python 3.14 "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" "$RUNNER_TEMP/dist/chess-0.1.0-py3-none-any.whl"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" -c 'import chess, sys; from pathlib import Path; from chess import ChessGame; assert Path(chess.__file__).is_relative_to(Path(sys.prefix)); assert Path(chess.__file__).with_name("py.typed").is_file(); assert len(ChessGame().legal_moves()) == 20'
