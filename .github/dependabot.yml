version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # pytest is pinned to 8.x in pyproject.toml.
      - dependency-name: "pytest"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      # init/analyze/upload-sarif must stay on the same release; separate
      # PRs fail CodeQL with a version mismatch.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
