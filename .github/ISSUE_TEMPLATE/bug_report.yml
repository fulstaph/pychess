name: Bug Report
description: Report incorrect behavior in the engine, CLI, TUI, or web UI
title: "[Bug]: "
labels: ["bug"]

body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Rules / move generation (chess.game, chess.attacks)
        - Notation / SAN parsing
        - Engine / AI (chess.engine)
        - UCI / Stockfish
        - Terminal UI (chess.tui)
        - Web UI (chess.web)
        - Notebooks
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: Include the FEN or move list that triggers it when relevant.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. uv run --locked python -m chess.engine
        2. Enter "..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and Python version (`python --version`).
      placeholder: macOS 15, Python 3.14.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Traceback / logs
      render: shell
