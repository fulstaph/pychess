<!DOCTYPE html>
<html lang="en">
  <!--
    pychess Web UI — single self-contained HTML document.

    ``chess/ui/__init__.py::get_html()`` reads this file plus ``style.css``
    and ``app.js`` and inlines them into the two placeholders
    (``/* __INJECT_CSS__ */`` and ``// __INJECT_JS__``), so the served page
    needs no separate asset requests. Only the Chessground stylesheets
    load from a CDN.
  -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pychess - Web UI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@lichess-org/chessground/assets/chessground.base.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@lichess-org/chessground/assets/chessground.brown.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@lichess-org/chessground/assets/chessground.cburnett.css">
  <style>
/* __INJECT_CSS__ */
  </style>
</head>
<body>
  <header>
    <div class="logo">pychess <span class="badge">Web UI</span></div>
    <div id="connection-status" class="badge">Connected</div>
  </header>

  <main>
    <!-- Chessground mount point: #cg-board is populated by app.js; the
         promotion dialog (#promo-modal) is an overlay shown only on a
         pawn promotion. The eval bar below the board tracks engine score. -->
    <div class="board-container">
      <div id="board-wrap">
        <div id="cg-board"></div>
        <div id="promo-modal">
          <div class="promo-choices">
            <div class="promo-btn" data-piece="q">♛</div>
            <div class="promo-btn" data-piece="r">♜</div>
            <div class="promo-btn" data-piece="b">♝</div>
            <div class="promo-btn" data-piece="n">♞</div>
          </div>
        </div>
      </div>
      <!-- Eval bar: #eval-fill width encodes the -1000..+1000 engine score -->
      <div id="eval-bar"><div id="eval-fill"></div></div>
    </div>

    <!-- Sidebar: status bar, opponent selector, move history, control
         buttons, and the FEN loader (see app.js for handlers). -->
    <div class="sidebar">
      <div class="panel-section">
        <h3>Match Status</h3>
        <div id="status-card" class="status-banner">
          <span id="turn-text">White to move</span>
          <span id="state-text">Active</span>
        </div>
        <div class="captures-row">
          <div>W captures: <span id="cap-w" class="cap-list"></span></div>
          <div>B captures: <span id="cap-b" class="cap-list"></span></div>
        </div>
      </div>
      <!-- Opponent/mode selector: minimax depths, Stockfish, or pass & play -->

      <div class="panel-section">
        <h3>Opponent</h3>
        <select id="ai-mode">
          <option value="minimax-2">Minimax AI (Depth 2)</option>
          <option value="minimax-1">Minimax AI (Depth 1)</option>
          <option value="stockfish">Stockfish Engine</option>
          <option value="human">Pass & Play (Two-Player)</option>
        </select>
      </div>
      <!-- Move history: rebuilt as paired "N. White  Black" rows by app.js -->

      <div class="panel-section">
        <h3>Move History</h3>
        <div id="moves-history" class="moves-box"></div>
      </div>
      <!-- Sessions: list of persisted games with New/Delete controls;
           switching sessions reloads that game's board state. -->

      <div class="panel-section">
        <h3>Sessions</h3>
        <select id="sessions-select"></select>
        <div class="btn-row">
          <button id="btn-session-delete">Delete Session</button>
        </div>
      </div>
      <!-- Control buttons: undo (2 plies in AI modes), flip, AI move, reset -->

      <div class="panel-section btn-row">
        <button id="btn-undo">Undo</button>
        <button id="btn-flip">Flip Board</button>
        <button id="btn-ai" class="primary">AI Move</button>
        <button id="btn-new">New Game</button>
      </div>
      <!-- FEN input: pasting a position POSTs /api/v1/sessions/{id}/reset with that FEN -->

      <div class="panel-section">
        <h3>Position FEN</h3>
        <input type="text" id="fen-input" placeholder="Paste FEN to load position...">
      </div>
    </div>
  </main>
  <!-- Inline module script: app.js is injected here by get_html() -->

  <script type="module">
// __INJECT_JS__
  </script>
</body>
</html>
