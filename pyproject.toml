[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess"
version = "0.1.0"
description = "A simple, type-safe chess engine in Python"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<8",
    # Ruff's formatter emits invalid Python 2 `except A, B:` syntax for the
    # py314 target from 0.15.0 through 0.16.9 (latest at pin time); 0.14.14
    # is the last release that formats py314 code correctly.
    "ruff>=0.14.14,<0.15",
]

notebooks = [
    "ipykernel>=6,<8",
    "jupyterlab>=4,<5",
    "nbclient>=0.10,<1",
]

[tool.setuptools]
packages = ["chess", "chess.ui"]

[tool.setuptools.package-data]
chess = ["py.typed"]
"chess.ui" = ["*.html", "*.css", "*.js"]

[tool.mypy]
python_version = "3.14"
files = ["chess"]
strict = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E",
    "EXE",
    "F",
    "FA",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "LOG",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLOT",
    "T10",
    "UP",
    "W",
    "YTT",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S310", "S603"]
"notebooks/*" = ["E501", "S101"]
"chess/web.py" = ["E501"]

[dependency-groups]
dev = [
    "httpx>=0.27",
]
